
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Canteen - Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        /* NAVBAR */

        .navbar {
            background: #222;
            color: white;
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-links a,
        .nav-links button {
            color: white;
            text-decoration: none;
            background: transparent;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-links a:hover,
        .nav-links button:hover {
            background: #444;
        }

        .logout {
            background: #b00020 !important;
        }

        /* CONTAINER */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        /* WELCOME */

        .welcome {
            background: white;
            padding: 28px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .welcome h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #666;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            margin: 0;
            color: #666;
            font-size: 15px;
        }

        .stat-card p {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0 0;
        }

        /* ORDERS */

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .orders-header h2 {
            margin: 0;
        }

        .refresh-btn {
            background: #222;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #444;
        }

        .orders {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .order-top h3 {
            margin: 0;
        }

        .order-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .info-box {
            background: #f7f7f7;
            padding: 12px;
            border-radius: 8px;
        }

        .info-box strong {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }

        .amount {
            font-size: 20px;
            font-weight: bold;
        }

        /* STATUS */

        .status {
            font-weight: bold;
        }

        select {
            padding: 10px;
            margin-top: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            background: white;
            cursor: pointer;
        }

        .update-btn {
            padding: 10px 16px;
            margin-left: 8px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #444;
        }

        .message {
            margin-top: 12px;
            font-weight: bold;
        }

        .loading,
        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            color: #666;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .navbar {
                flex-direction: column;
                gap: 12px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .order-info {
                grid-template-columns: 1fr;
            }

            .order-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .update-btn {
                margin-left: 0;
                margin-top: 8px;
            }

        }

    </style>

</head>

<body>


<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">
        🍽️ Smart Canteen Admin
    </div>

    <div class="nav-links">

        <a href="admin-dashboard.html">
            Dashboard
        </a>

        <a href="admin-food.html">
            Manage Food
        </a>

        <button class="logout"
                onclick="logout()">
            Logout
        </button>

    </div>

</div>


<!-- MAIN -->

<div class="container">


    <!-- WELCOME -->

    <div class="welcome">

        <h1>
            Admin Dashboard
        </h1>

        <p>
            Manage student orders and update their order status.
        </p>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat-card">

            <h3>
                Total Orders
            </h3>

            <p id="totalOrders">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>
                Pending Orders
            </h3>

            <p id="pendingOrders">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>
                Total Sales
            </h3>

            <p id="totalSales">
                ₹0.00
            </p>

        </div>

    </div>


    <!-- ORDERS HEADER -->

    <div class="orders-header">

        <h2>
            📋 All Student Orders
        </h2>

        <button class="refresh-btn"
                onclick="loadOrders()">

            🔄 Refresh

        </button>

    </div>


    <!-- ORDERS -->

    <div id="orders"
         class="orders">

        <div class="loading">
            Loading orders...
        </div>

    </div>


</div>


<script>


    // ========================================
    // LOAD ALL ORDERS
    // ========================================

    function loadOrders() {

        fetch("/api/order/all")

            .then(function(response) {

                if (!response.ok) {

                    throw new Error(
                        "Unable to load orders"
                    );

                }

                return response.json();

            })

            .then(function(orders) {

                const ordersDiv =
                    document.getElementById("orders");

                ordersDiv.innerHTML = "";


                // UPDATE STATS

                let totalSales = 0;

                let pendingOrders = 0;


                orders.forEach(function(order) {

                    totalSales +=
                        Number(order.totalAmount || 0);


                    if (
                        order.orderStatus &&
                        order.orderStatus.toLowerCase()
                        === "pending"
                    ) {

                        pendingOrders++;

                    }

                });


                document.getElementById(
                    "totalOrders"
                ).innerText = orders.length;


                document.getElementById(
                    "pendingOrders"
                ).innerText = pendingOrders;


                document.getElementById(
                    "totalSales"
                ).innerText =
                    "₹" + totalSales.toFixed(2);


                // NO ORDERS

                if (orders.length === 0) {

                    ordersDiv.innerHTML = `
                    <div class="empty">
                        No student orders found.
                    </div>
                `;

                    return;
                }


                // DISPLAY ORDERS

                orders.forEach(function(order) {

                    const currentStatus =
                        order.orderStatus || "Pending";


                    ordersDiv.innerHTML += `

                    <div class="order-card">

                        <div class="order-top">

                            <h3>
                                🧾 Order #${order.orderId}
                            </h3>

                            <span class="status">
                                ${currentStatus}
                            </span>

                        </div>


                        <div class="order-info">


                            <div class="info-box">

                                <strong>
                                    Student ID
                                </strong>

                                ${order.studentId}

                            </div>


                            <div class="info-box">

                                <strong>
                                    Order Date
                                </strong>

                                ${order.orderDate}

                            </div>


                            <div class="info-box">

                                <strong>
                                    Total Amount
                                </strong>

                                <span class="amount">
                                    ₹${Number(
                        order.totalAmount || 0
                    ).toFixed(2)}
                                </span>

                            </div>


                            <div class="info-box">

                                <strong>
                                    Current Status
                                </strong>

                                ${currentStatus}

                            </div>


                        </div>


                        <select
                            id="status-${order.orderId}">

                            <option value="Pending"
                                ${currentStatus === "Pending"
                        ? "selected"
                        : ""}>

                                Pending

                            </option>

                            <option value="Preparing"
                                ${currentStatus === "Preparing"
                        ? "selected"
                        : ""}>

                                Preparing

                            </option>

                            <option value="Confirmed"
                                ${currentStatus === "Confirmed"
                        ? "selected"
                        : ""}>

                                Confirmed

                            </option>

                            <option value="Completed"
                                ${currentStatus === "Completed"
                        ? "selected"
                        : ""}>

                                Completed

                            </option>

                        </select>


                        <button
                            class="update-btn"
                            onclick="updateStatus(${order.orderId})">

                            Update Status

                        </button>


                        <div
                            id="message-${order.orderId}"
                            class="message">

                        </div>


                    </div>

                `;

                });

            })


            .catch(function(error) {

                console.error(error);

                document.getElementById(
                    "orders"
                ).innerHTML = `

                <div class="empty">

                    ❌ Unable to load orders.

                </div>

            `;

            });

    }


    // ========================================
    // UPDATE ORDER STATUS
    // ========================================

    function updateStatus(orderId) {


        const select =
            document.getElementById(
                "status-" + orderId
            );


        const status =
            select.value;


        fetch("/api/order/status", {

            method: "PUT",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body: JSON.stringify({

                orderId: orderId,

                orderStatus: status

            })

        })


            .then(function(response) {

                return response.text();

            })


            .then(function(data) {

                const message =
                    document.getElementById(
                        "message-" + orderId
                    );


                message.innerText =
                    data;


                setTimeout(function() {

                    loadOrders();

                }, 500);

            })


            .catch(function(error) {

                console.error(error);


                document.getElementById(
                    "message-" + orderId
                ).innerText =
                    "❌ Unable to update status!";

            });

    }


    // ========================================
    // LOGOUT
    // ========================================

    function logout() {

        localStorage.removeItem("studentId");

        localStorage.removeItem("cart");

        localStorage.removeItem("orderId");

        localStorage.removeItem("orderAmount");

        window.location.href =
            "login.html";

    }


    // ========================================
    // INITIAL LOAD
    // ========================================

    loadOrders();


</script>

</body>

</html>
