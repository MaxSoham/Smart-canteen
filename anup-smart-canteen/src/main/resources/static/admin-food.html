
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Smart Canteen - Manage Food</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .navbar {
      background: #222;
      color: white;
      padding: 16px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .nav-links a,
    .nav-links button {
      color: white;
      text-decoration: none;
      background: transparent;
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .nav-links a:hover,
    .nav-links button:hover {
      background: #444;
    }

    .logout {
      background: #b00020 !important;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 35px auto;
    }

    .header-card,
    .form-card,
    .food-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .header-card {
      padding: 28px;
      margin-bottom: 25px;
    }

    .header-card h1 {
      margin: 0 0 8px;
    }

    .header-card p {
      margin: 0;
      color: #666;
    }

    .form-card {
      padding: 25px;
      margin-bottom: 30px;
    }

    .form-card h2 {
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 15px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
      margin-top: 15px;
    }

    .add-btn {
      margin-top: 15px;
      padding: 12px 20px;
      background: #222;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
    }

    .add-btn:hover {
      background: #444;
    }

    .message {
      margin-top: 12px;
      font-weight: bold;
    }

    .food-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .food-header h2 {
      margin: 0;
    }

    .refresh-btn {
      padding: 10px 18px;
      background: #222;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .food-card {
      padding: 22px;
    }

    .food-card h3 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .food-description {
      color: #666;
      min-height: 45px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
    }

    .delete-btn {
      width: 100%;
      padding: 10px;
      background: #b00020;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #8a0019;
    }

    .loading,
    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 12px;
      color: #666;
    }

    @media (max-width: 800px) {

      .navbar {
        flex-direction: column;
        gap: 12px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .food-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 500px) {

      .food-grid {
        grid-template-columns: 1fr;
      }

      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
      }

    }

  </style>

</head>


<body>


<!-- NAVBAR -->

<div class="navbar">

  <div class="logo">
    🍽️ Smart Canteen Admin
  </div>

  <div class="nav-links">

    <a href="admin-dashboard.html">
      Dashboard
    </a>

    <a href="admin-food.html">
      Manage Food
    </a>

    <button class="logout"
            onclick="logout()">
      Logout
    </button>

  </div>

</div>


<!-- MAIN -->

<div class="container">


  <!-- HEADER -->

  <div class="header-card">

    <h1>
      🍕 Manage Food
    </h1>

    <p>
      Add and manage food items available to all students.
    </p>

  </div>


  <!-- ADD FOOD -->

  <div class="form-card">

    <h2>
      ➕ Add New Food Item
    </h2>

    <div class="form-grid">

      <input
              type="text"
              id="itemName"
              placeholder="Food item name">

      <input
              type="number"
              id="price"
              placeholder="Price"
              min="1"
              step="0.01">

    </div>

    <textarea
            id="description"
            placeholder="Food description"></textarea>


    <button class="add-btn"
            onclick="addFood()">

      Add Food Item

    </button>


    <div id="message"
         class="message">
    </div>

  </div>


  <!-- FOOD LIST -->

  <div class="food-header">

    <h2>
      🍴 Available Food
    </h2>

    <button class="refresh-btn"
            onclick="loadFood()">

      🔄 Refresh

    </button>

  </div>


  <div id="foodList"
       class="food-grid">

    <div class="loading">
      Loading food items...
    </div>

  </div>


</div>


<script>


  // ========================================
  // LOAD FOOD
  // ========================================

  function loadFood() {

    fetch("/api/food")

            .then(function(response) {

              if (!response.ok) {

                throw new Error(
                        "Unable to load food"
                );

              }

              return response.json();

            })

            .then(function(foodItems) {

              const foodList =
                      document.getElementById("foodList");

              foodList.innerHTML = "";


              if (foodItems.length === 0) {

                foodList.innerHTML = `

                    <div class="empty">

                        No food items available.

                    </div>

                `;

                return;
              }


              foodItems.forEach(function(food) {

                foodList.innerHTML += `

                    <div class="food-card">

                        <h3>
                            ${food.itemName}
                        </h3>

                        <div class="food-description">

                            ${food.description || "No description available."}

                        </div>

                        <div class="price">

                            ₹${Number(
                        food.price || 0
                ).toFixed(2)}

                        </div>

                        <button
                            class="delete-btn"
                            onclick="deleteFood(${food.foodItemId})">

                            🗑️ Delete

                        </button>

                    </div>

                `;

              });

            })

            .catch(function(error) {

              console.error(error);

              document.getElementById(
                      "foodList"
              ).innerHTML = `

                <div class="empty">

                    ❌ Unable to load food items.

                </div>

            `;

            });

  }


  // ========================================
  // ADD FOOD
  // ========================================

  function addFood() {

    const itemName =
            document.getElementById(
                    "itemName"
            ).value.trim();


    const price =
            document.getElementById(
                    "price"
            ).value;


    const description =
            document.getElementById(
                    "description"
            ).value.trim();


    const message =
            document.getElementById(
                    "message"
            );


    if (!itemName || !price) {

      message.innerText =
              "❌ Please enter food name and price.";

      return;
    }


    fetch("/api/food/add", {

      method: "POST",

      headers: {

        "Content-Type":
                "application/json"

      },

      body: JSON.stringify({

        itemName: itemName,

        price: Number(price),

        description: description

      })

    })

            .then(function(response) {

              return response.text();

            })

            .then(function(data) {

              message.innerText =
                      "✅ " + data;


              document.getElementById(
                      "itemName"
              ).value = "";


              document.getElementById(
                      "price"
              ).value = "";


              document.getElementById(
                      "description"
              ).value = "";


              loadFood();

            })

            .catch(function(error) {

              console.error(error);

              message.innerText =
                      "❌ Failed to add food item.";

            });

  }


  // ========================================
  // DELETE FOOD
  // ========================================

  function deleteFood(foodItemId) {


    if (!confirm(
            "Are you sure you want to delete this food item?"
    )) {

      return;
    }


    fetch(
            "/api/food/" + foodItemId,
            {
              method: "DELETE"
            }
    )

            .then(function(response) {

              return response.text();

            })

            .then(function(data) {

              alert(data);

              loadFood();

            })

            .catch(function(error) {

              console.error(error);

              alert(
                      "Failed to delete food item."
              );

            });

  }


  // ========================================
  // LOGOUT
  // ========================================

  function logout() {

    localStorage.removeItem("studentId");

    localStorage.removeItem("cart");

    localStorage.removeItem("orderId");

    localStorage.removeItem("orderAmount");

    window.location.href =
            "login.html";

  }


  // ========================================
  // INITIAL LOAD
  // ========================================

  loadFood();


</script>

</body>

</html>
